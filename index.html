<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Die App laedt nichts aus dem Netz. Die Richtlinie haelt das auch dann
     durch, wenn ein eingelesenes PDF oder Projekt etwas anderes versucht.
     'unsafe-inline' ist noetig, weil Oberflaeche und Logik in dieser Datei
     stehen; blob: und data: brauchen Bilder, Schriften und der PDF-Export. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#2440b3">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Blattwerk</title>
<style>
/* Schriften liegen in der App. Anzeige und Export vermessen Text mit denselben
   Dateien (fontkit), deshalb bricht das PDF genau dort um, wo es der
   Bildschirm zeigt. */
@font-face{font-family:"BW Sans";src:url("fonts/NotoSans-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"BW Sans";src:url("fonts/NotoSans-Bold.ttf") format("truetype");font-weight:700;font-style:normal}
@font-face{font-family:"BW Sans";src:url("fonts/NotoSans-Italic.ttf") format("truetype");font-weight:400;font-style:italic}
@font-face{font-family:"BW Sans";src:url("fonts/NotoSans-BoldItalic.ttf") format("truetype");font-weight:700;font-style:italic}
@font-face{font-family:"BW Serif";src:url("fonts/NotoSerif-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"BW Serif";src:url("fonts/NotoSerif-Bold.ttf") format("truetype");font-weight:700;font-style:normal}
@font-face{font-family:"BW Serif";src:url("fonts/NotoSerif-Italic.ttf") format("truetype");font-weight:400;font-style:italic}
@font-face{font-family:"BW Serif";src:url("fonts/NotoSerif-BoldItalic.ttf") format("truetype");font-weight:700;font-style:italic}
@font-face{font-family:"BW Mono";src:url("fonts/NotoSansMono-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"BW Mono";src:url("fonts/NotoSansMono-Bold.ttf") format("truetype");font-weight:700;font-style:normal}
@font-face{font-family:"BW Math";src:url("fonts/NotoSansMath-Regular.ttf") format("truetype");font-weight:400 700;font-style:normal italic}

/* Gestaltung: Werkzeugleiste links, Arbeitsflaeche mit Karopapier in der
   Mitte, Eigenschaften rechts; auf schmalen Geraeten Werkzeuge unten. */
:root{
  --desk:#e6e9f0; --grid:rgba(36,64,179,.075); --panel:#fbfcfe; --raise:#ffffff;
  --ink:#1a2030; --muted:#566074; --line:#d2d7e2; --accent:#2440b3; --on-accent:#ffffff;
  --accent-soft:rgba(36,64,179,.10); --mark:#ffe14d; --danger:#b3261e; --ok:#2e7d32;
  --shadow:0 1px 2px rgba(20,28,50,.08),0 10px 28px rgba(20,28,50,.12);
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
/* Darstellung: wie das System, oder in den Einstellungen fest hell/dunkel */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#13161d; --grid:rgba(125,149,255,.07); --panel:#1b1f28; --raise:#232836;
  --ink:#e5e8ef; --muted:#9aa3b6; --line:#323949; --accent:#8ea2ff; --on-accent:#0c1022;
  --accent-soft:rgba(142,162,255,.14); --danger:#ff8a80; --ok:#7ed58a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#13161d; --grid:rgba(125,149,255,.07); --panel:#1b1f28; --raise:#232836;
  --ink:#e5e8ef; --muted:#9aa3b6; --line:#323949; --accent:#8ea2ff; --on-accent:#0c1022;
  --accent-soft:rgba(142,162,255,.14); --danger:#ff8a80; --ok:#7ed58a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-columns:80px minmax(0,1fr) 310px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"bar bar bar" "tools stage panel";
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.bar{grid-area:bar;display:flex;align-items:center;gap:8px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.01em;flex:none}
.brand .logo{width:28px;height:28px}
button.brand{border:0;background:transparent;padding:4px 6px;border-radius:8px;color:inherit}
button.brand:hover{background:var(--accent-soft)}

/* Startbildschirm, Einstellungen, Hilfe */
.home{position:fixed;inset:0;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;background-color:var(--desk);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18.9px 18.9px;
  padding:calc(24px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.home-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.home-head{display:flex;align-items:center;gap:14px}
.home-head svg{width:56px;height:56px;flex:none}
.home-head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.home-head p{margin:2px 0 0;color:var(--muted)}
.home-cont{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--accent);background:var(--raise);box-shadow:var(--shadow)}
.home-cont b{display:block;font-size:16px}.home-cont span{color:var(--muted);font-size:13px}
.home-cont .go{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.home-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.home-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--raise);box-shadow:var(--shadow);min-height:118px}
.home-tile:hover{border-color:var(--accent)}
.home-tile svg.i{width:28px;height:28px;color:var(--accent)}
.home-tile>div{display:flex;flex-direction:column;gap:4px}
.home-tile b{font-size:16px}.home-tile span{color:var(--muted);font-size:13px;line-height:1.4}
.home-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.home-card h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.home-recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.home-recent li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.home-recent li:first-child{border-top:0}
.home-recent .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-recent .sub{font-size:12px;color:var(--muted)}
.home-recent .meta{flex:1;min-width:0}
.home-foot{display:flex;flex-wrap:wrap;gap:10px}
.home-foot .btn{flex:1 1 160px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.home-top{display:flex;align-items:center;gap:10px}
.home-top h1{margin:0;font-size:24px;font-weight:800}
.home .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home .row>label:first-child,.home .row>.dl{min-width:150px;color:var(--muted);font-size:13px}
.home .tg{display:flex;align-items:center;gap:8px}
.home details{border-top:1px solid var(--line);padding:10px 0}
.home details:first-of-type{border-top:0}
.home summary{font-weight:700;cursor:pointer;font-size:15px}
.home details p,.home details li{line-height:1.55;color:var(--ink)}
.home details ul,.home details ol{padding-left:20px;margin:8px 0}
.home .kbd{font-size:13px;color:var(--muted);line-height:1.8}
body.home-open #app{visibility:hidden}
@media (max-width:560px){.home-tiles{grid-template-columns:1fr}.home-tile{min-height:0;flex-direction:row;align-items:center}.home-head h1{font-size:26px}}
.docname{flex:1 1 140px;min-width:0;max-width:340px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-weight:700}
.docname:hover{border-color:var(--line)} .docname:focus{border-color:var(--accent);background:var(--raise);outline:none}
.spacer{flex:1}
.hb{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;white-space:nowrap}
.hb:hover:not(:disabled){background:var(--accent-soft)}
.hb:disabled{opacity:.38;cursor:default}
.hb.primary{background:var(--accent);color:var(--on-accent);font-weight:700;padding:0 14px}
.zoom{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:38px}
.zoom button{width:34px;height:36px;border:0;background:transparent;border-radius:7px}
.zoom button:hover{background:var(--accent-soft)}
.zoom .zl{min-width:58px;font-variant-numeric:tabular-nums;font-size:13px}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.layerpill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);font-size:12px;font-weight:700;background:var(--raise)}
.layerpill i{width:9px;height:9px;border-radius:50%;display:inline-block}

.tools{grid-area:tools;display:flex;flex-direction:column;gap:1px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:10.5px;line-height:1.15;text-align:center}
.tool svg.i{width:21px;height:21px}
.tool:hover{background:var(--accent-soft);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.stage{grid-area:stage;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;
  background-color:var(--desk);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18.9px 18.9px;background-attachment:local;-webkit-touch-callout:none}
#pages{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 16px 96px;width:max-content;min-width:100%;transform-origin:0 0}
.pwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.page{position:relative;background:#fff;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;isolation:isolate}
.page.cur{outline:2px solid var(--accent-soft);outline-offset:3px}
.pcap{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pcv-holder,.lyr{position:absolute;inset:0;pointer-events:none}
.obj,.lnbox{pointer-events:auto}
.pcv-holder canvas{width:100%;height:100%;display:block}
.page.loading .pcv-holder::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#f3f5f9 0 12px,#fff 12px 24px)}
.lnlayer{display:none}
body.t-edittext .lnlayer,body.t-erase .lnlayer{display:block}
body.t-erase .page{cursor:crosshair;touch-action:none}
body.splitting .page{cursor:row-resize}
.ebox{position:absolute;border:1.5px dashed rgba(198,40,40,.75);background:rgba(198,40,40,.06);border-radius:2px;cursor:pointer;pointer-events:auto}
.ebox:hover{background:rgba(198,40,40,.18);border-style:solid}
.obj.solcover{opacity:.35;outline:1.5px dashed #c62828;outline-offset:0}
.obj.solcover::after{content:"Lösung";position:absolute;left:0;top:-12px;font-size:9px;font-weight:700;color:#c62828;opacity:1}
.lnbox{position:absolute;border:1px dashed rgba(36,64,179,.55);background:rgba(36,64,179,.06);border-radius:2px;cursor:text}
.lnbox:hover{background:rgba(36,64,179,.16);border-style:solid}
.lnbox.ocr,.ebox.ocr{z-index:4}
.lnbox.ocr{border-color:rgba(15,138,126,.7);background:rgba(15,138,126,.07)}.lnbox.ocr:hover{background:rgba(15,138,126,.18)}
.ocrlow{position:absolute;bottom:-2px;height:3px;background:repeating-linear-gradient(90deg,#e8710a 0 4px,transparent 4px 6px);pointer-events:none}
.ocbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.ocbar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.cover{position:absolute}
.guide{position:absolute;background:#e0247a;pointer-events:none;z-index:9}
.guide.v{width:1px;top:0;bottom:0}.guide.h{height:1px;left:0;right:0}
.marquee{position:absolute;border:1px solid #2440b3;background:rgba(36,64,179,.08);pointer-events:none;z-index:9}
body.tap-tool .page{cursor:crosshair}
body.drawing .page{cursor:crosshair;touch-action:none}

.obj{position:absolute;touch-action:none;cursor:move}
.obj.pts{pointer-events:none}.obj.pts .hit{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.obj.pts .hit path{pointer-events:visiblePainted}.o-shape svg{overflow:visible}.obj.pts .hdl{pointer-events:auto}
.obj.sel{outline:1.5px solid #2440b3;outline-offset:2px;z-index:5}
.obj.msel{outline:1.5px dashed #2440b3;outline-offset:2px;z-index:5}
.obj.lay-help::before,.obj.lay-sol::before{position:absolute;left:-1px;top:-13px;font:700 8.5px/11px var(--f-ui);letter-spacing:.04em;padding:0 4px;border-radius:3px;color:#fff;pointer-events:none;white-space:nowrap}
.obj.lay-help::before{content:"HILFE";background:#0f8a7e}
.obj.lay-sol::before{content:"LÖSUNG";background:#c62828}
body.no-tags .obj::before{display:none}
.o-text .tx{white-space:pre-wrap;overflow-wrap:anywhere;outline:none;font-kerning:none;font-synthesis:none;font-variant-ligatures:common-ligatures}
.o-text .tx[contenteditable="true"]{cursor:text;-webkit-user-select:text;user-select:text}
.o-text .ln{position:absolute;left:0;white-space:pre;font-kerning:none;font-synthesis:none}
.o-text.editing{outline:1.5px dashed #2440b3;outline-offset:2px;z-index:6}
.o-text .tx:empty::before{content:"Text eingeben";color:#9aa1b0}
.o-text .ph{color:#9aa1b0}
.o-highlight{mix-blend-mode:multiply;opacity:.55}
.o-field{font-family:"BW Sans",sans-serif;color:#1a2030;overflow:hidden}
.o-field.bd{border:1px solid #6a7286}
.o-field.bg{background:#edf2ff}
.o-field:not(.bd){box-shadow:inset 0 0 0 1px rgba(36,64,179,.3)}
.o-field .fl{position:absolute;left:3px;top:2px;right:3px;white-space:pre-wrap;line-height:1.15}
.o-field .fl.ph{color:#7b8396;font-style:italic}
.o-field .fl.sol{color:#c62828;font-style:italic}
.o-field .tag{position:absolute;right:3px;bottom:2px;font-weight:700;color:#4a5ccc;letter-spacing:.04em;text-transform:uppercase;opacity:.75;font-family:var(--f-ui)}
.o-check{display:flex;align-items:center;white-space:nowrap;font-family:"BW Sans","BW Math",sans-serif;color:#000;font-kerning:none}
.o-check .cb{border:1px solid #262b38;background:#fff;flex:none;display:grid;place-items:center}
.o-check .cb svg{width:80%;height:80%;stroke:#000;stroke-width:3;fill:none}
.o-check .cb.sol svg{stroke:#c62828}
.o-check .cb.round{border-radius:50%}
.o-check .cb .dot{width:46%;height:46%;border-radius:50%;background:#000}
.o-check .cb.sol .dot{background:#c62828}
.o-field .drop{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#4a5ccc;font-weight:700}
.o-image img{width:100%;height:100%;display:block;pointer-events:none}
.o-image .cap{position:absolute;left:0;top:100%;font-family:"BW Sans",sans-serif;line-height:1.2;color:#555;white-space:nowrap;pointer-events:none}
.obj svg.pr{display:block;overflow:visible}
.ghost{position:absolute;border:1.5px dashed #2440b3;background:rgba(36,64,179,.08);pointer-events:none}
.ghostline{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.hdl{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid #2440b3;border-radius:2px;z-index:7}
.hdl[data-d="nw"]{left:-8px;top:-8px;cursor:nwse-resize}.hdl[data-d="se"]{right:-8px;bottom:-8px;cursor:nwse-resize}
.hdl[data-d="ne"]{right:-8px;top:-8px;cursor:nesw-resize}.hdl[data-d="sw"]{left:-8px;bottom:-8px;cursor:nesw-resize}
.hdl[data-d="e"]{right:-8px;top:calc(50% - 6px);cursor:ew-resize}.hdl[data-d="w"]{left:-8px;top:calc(50% - 6px);cursor:ew-resize}
.hdl.pt{border-radius:50%;cursor:crosshair;transform:translate(-50%,-50%)}
@media (pointer:coarse){.hdl{width:24px;height:24px;border-radius:50%}
  .hdl[data-d="nw"]{left:-14px;top:-14px}.hdl[data-d="se"]{right:-14px;bottom:-14px}.hdl[data-d="ne"]{right:-14px;top:-14px}.hdl[data-d="sw"]{left:-14px;bottom:-14px}
  .hdl[data-d="e"]{right:-14px;top:calc(50% - 12px)}.hdl[data-d="w"]{left:-14px;top:calc(50% - 12px)}}

.panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:4px 0 calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.panel section{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.panel p{margin:0;line-height:1.45;color:var(--muted);max-width:60ch}
.panel p.note{font-size:13px;background:var(--accent-soft);color:var(--ink);padding:8px 10px;border-radius:8px}
.panel p.warn{font-size:13px;color:var(--danger)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>label{min-width:84px;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 9px;font-size:13px;min-width:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{opacity:.4}
.num{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.num input{width:52px;border:0;background:transparent;text-align:center;padding:7px 0;font-variant-numeric:tabular-nums}
.num button{border:0;background:transparent;width:32px;height:34px}
.num button:hover{background:var(--accent-soft)}
.num.sm input{width:38px}.num.sm button{width:26px}
.tin{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:8px 9px}
.tin:focus{border-color:var(--accent);outline:none}
textarea.tin{min-height:64px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.4}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--raise);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw input[type=color]{width:32px;height:30px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--raise)}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.tg input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts.three{grid-template-columns:1fr 1fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:9px 10px;font-size:13px;text-align:center;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger)}
.btn.wide{grid-column:1/-1}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pal button{min-width:34px;height:32px;border:1px solid var(--line);background:var(--raise);border-radius:6px;font-family:"BW Sans","BW Math",sans-serif;font-size:14px;padding:0 6px}
.pal button:hover{border-color:var(--accent)}
.kbd{font-size:12px;color:var(--muted);line-height:1.6}
.kbd b{font-weight:700;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
.stat{display:flex;gap:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stat b{color:var(--ink);font-size:18px;display:block}
.bars{display:flex;flex-direction:column;gap:5px}
.bar1{display:grid;grid-template-columns:44px 1fr 46px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bar1 .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar1 .tr i{display:block;height:100%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 6px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--raise);font-size:12px}
.tile svg{width:100%;max-width:62px;aspect-ratio:595/842;height:auto;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.tile:hover{border-color:var(--accent)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.rng{display:grid;grid-template-columns:22px auto auto;gap:6px 8px;align-items:center;justify-content:start;font-size:13px;color:var(--muted)}
.grid-ed{overflow-x:auto;padding-bottom:4px}
.grid-ed table{border-collapse:collapse}
.grid-ed td{padding:1px}
.grid-ed input{width:52px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:5px 4px;font-size:13px;text-align:center}
.grid-ed input.sol{color:#c62828;font-style:italic;border-color:#e3a5a5}
.fnrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.fnrow .dot{width:16px;height:16px;border-radius:50%}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.links a{color:var(--accent)}
.only-narrow,.panel section.only-narrow{display:none}
.mini{font-size:12px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(560px,calc(100% - 32px));pointer-events:none}
.tst{background:var(--ink);color:var(--panel);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;pointer-events:auto;line-height:1.4}
.tst span{flex:1}
.tst button{border:0;background:transparent;color:var(--mark);font-weight:700;padding:4px 6px}
.dlg{position:fixed;inset:0;background:rgba(10,14,25,.45);display:grid;place-items:center;z-index:60;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dlg .box{background:var(--panel);border-radius:14px;padding:20px;max-width:400px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;overscroll-behavior:contain}
.dlg .box.wide{max-width:560px}
.dlg .box.xwide{max-width:980px}
.dlg p{margin:0;line-height:1.5}
.dlg h2.dh{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.dlg h3{margin:4px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dlg .dnote{color:var(--muted);font-size:13px}
.dlg .row.end{justify-content:flex-end}
.dl{min-width:70px;color:var(--muted)}
.lib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lib li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;background:var(--raise)}
.lib .meta{flex:1;min-width:0}
.lib .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lib .cur-tag{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--muted);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--raise);font-size:12px}
.thumb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.thumb canvas{max-width:100%;box-shadow:0 0 0 1px rgba(0,0,0,.12);background:#fff}
.cropwrap{position:relative;align-self:center;max-width:100%;touch-action:none;user-select:none}
.cropwrap canvas{display:block;max-width:100%;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.scanrow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.scanwrap{position:relative;flex:1 1 360px;max-width:640px;touch-action:none;user-select:none;line-height:0}
.scanwrap canvas{display:block;width:100%;height:auto;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.scanq{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.scanq polygon{fill:rgba(36,64,179,.12);stroke:#2440b3;stroke-width:2}
.sch{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #2440b3;background:rgba(255,255,255,.55);cursor:grab;touch-action:none}
.sch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scanside{flex:1 1 220px;display:flex;flex-direction:column;gap:10px;min-width:0}
.scanprev{line-height:0}.scanprev canvas{max-width:100%;max-height:300px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
@media (max-width:600px){.scanprev canvas{max-height:150px}.scanwrap{flex-basis:100%}}
.crsrc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.crsrc input.tin{flex:1 1 220px}
.cropwrap .sel{position:absolute;border:2px solid #2440b3;background:rgba(36,64,179,.12);pointer-events:none}
.evtable{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:10px}
.evtable table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;min-width:100%}
.evtable th,.evtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.evtable th{position:sticky;top:0;background:var(--panel);font-weight:700}
.evtable td:first-child,.evtable th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--danger);font-weight:700}
.busy{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,14,25,.25)}
.busy div{background:var(--panel);padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);font-weight:700}

@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"bar" "stage" "panel" "tools"}
  .bar{padding-left:10px;padding-right:10px;gap:2px}
  .brand span,.hb .lb,.zoom,.wide-only,.layerpill{display:none}
  .hb{padding:0 8px}
  .only-narrow{display:inline-flex} .panel section.only-narrow{display:flex}
  .tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;overflow-y:hidden;gap:2px}
  .tool{min-width:64px;flex:none}
  .panel{display:none;border-left:0;border-top:1px solid var(--line);max-height:46vh;padding-bottom:12px}
  body.panel-open .panel{display:block}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.tst{animation:tin .18s ease-out}@keyframes tin{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>

      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="20" height="26" rx="2.5" fill="var(--raise)" stroke="var(--accent)" stroke-width="2"/><path d="M9 10h12M9 15h12M9 20h7" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><rect x="18" y="18" width="9" height="9" rx="1.5" fill="var(--mark)" stroke="var(--ink)" stroke-width="1.6"/><path d="M20.2 22.5l1.8 1.8 3-3.4" stroke="var(--ink)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div class="spacer"></div>
    <button class="hb" id="btnNew" title="Neues Blatt mit Hintergrund"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg><span class="lb">Neu</span></button>
    <button class="hb" id="btnOpen" title="Meine Blätter und Dateien öffnen"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span class="lb">Meine Blätter</span></button>
    <div class="sep wide-only"></div>
    <button class="hb" id="btnUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg></button>
    <button class="hb" id="btnRedo" title="Wiederholen (Strg+Umschalt+Z)" aria-label="Wiederholen" disabled><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h4"/></svg></button>
    <div class="zoom" title="Zoom">
      <button id="zOut" aria-label="Verkleinern"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button id="zFit" class="zl" title="An Breite anpassen">100 %</button>
      <button id="zIn" aria-label="Vergrößern"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
    <button class="hb only-narrow" id="btnPanel" title="Seite und Einstellungen" aria-label="Seite und Einstellungen"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>

  </header>
  <nav class="tools" id="tools" aria-label="Werkzeuge"></nav>
  <main class="stage" id="stage"><div id="pages"></div></main>
  <aside class="panel" id="panel" aria-label="Eigenschaften"></aside>
</div>
<div id="home" class="home" hidden></div>
<div id="toast" aria-live="polite"></div>
<!-- Nur MIME-Typen: Android wertet Dateiendungen im accept-Attribut nicht aus

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="filePdf" accept="application/pdf" hidden>
<input type="file" id="fileEval" accept="application/pdf" multiple hidden>
<input type="file" id="fileFont" accept="font/ttf,font/otf,application/x-font-ttf,application/x-font-otf,application/font-sfnt,application/octet-stream" hidden>

const FONT_FILES = {

const fontCache = {};      /* Schluessel -> Promise<ArrayBuffer> */

async function fontBytes(key) {
  if (isCustom(key)) { const f = S.fonts[key.slice(2)]; if (!f) throw new Error('Schrift fehlt'); return f.bytes; }

  if (!window.fontkit) return;

const CHAR_MAP = { ' ': ' ', ' ': ' ', ' ': ' ', ' ': ' ', '­': '', '\t': '    ' };
/* Zerlegt Text in Abschnitte je Schrift: gewaehlte Schrift, sonst Mathe-Schrift,

    if (!f || f.hasGlyphForCodePoint(cp)) { push(ch, key); continue; }

    if (POLY[k]) {

      const side = POLY[k] === 3 ? `a = ${mm(inf.sides[1])} mm, b = ${mm(inf.sides[2])} mm, c = ${mm(inf.sides[0])} mm` : `AB = ${mm(inf.sides[0])}, BC = ${mm(inf.sides[1])}, CD = ${mm(inf.sides[2])}, DA = ${mm(inf.sides[3])} mm`;

      h += `${toggle('labels', o.labels, 'Ecken beschriften (A, B, C' + (POLY[k] === 4 ? ', D' : '') + ')')}<p class="mini">Seiten: ${side}<br>Winkel: ${'αβγδ'.split('').slice(0, POLY[k]).map((g, i) => g + ' = ' + deg(inf.angles[i])).join(', ')}</p><p class="mini">Ziehe die Eckpunkte. ${keep}</p>`;
    }
    if (k === 'line' || k === 'arrow' || k === 'darrow') h += `<p class="mini">Länge: ${fmtNum(Math.round(Math.hypot(o.x2 - o.x1, o.y2 - o.y1) / MM))} mm</p>${row('Art', segBtns('kind', [['line', 'Strecke'], ['arrow', 'Pfeil'], ['darrow', 'Doppelpfeil']], k))}`;

      ${row('Punkte', numIn('max', o.max, 0, 100, 0.5))}

      <div class="row"><label>Kompetenz</label><select class="tin" id="p-comp" data-prop="comp">${COMPS.map(([v, l]) => `<option value="${v}" ${o.comp === v ? 'selected' : ''}>${v ? v + ' – ' : ''}${esc(l)}</option>`).join('')}</select></div>

let panelSnapFor = null;

function applyBg(k, v) {
  const p = page(S.cur); if (!p || p.sid != null) return;
  if (panelSnapFor !== 'bg' + p.id + k) { snap(); panelSnapFor = 'bg' + p.id + k; }
  const b = Object.assign({}, BG_DEF, p.bg || {}); b[k] = v;
  if (k === 'type') b.size = v === 'lines' ? 9 : 5;
  p.bg = b; renderBg(p.id); queueSave();
}
function bgAll() {
  const p = page(S.cur); if (!p || p.sid != null) return; snap();
  S.pages.forEach(q => { if (q.sid == null && q !== p) { q.bg = Object.assign({}, p.bg, { top: q.bg && q.bg.top != null ? q.bg.top : p.bg.top }); renderBg(q.id); } });
  toast('Hintergrund auf alle leeren Seiten übertragen.');
}
function snapOnce(key) { if (panelSnapFor !== key) { snap(); panelSnapFor = key; } }
function applyProp(prop, v) {
  if (prop.startsWith('bg.')) return applyBg(prop.slice(3), v);
  if (prop === 'view.help' || prop === 'view.sol') { S.view[prop.slice(5)] = v; if (selIds().some(id => !visible(find(id)))) setSel(null); renderAll(); return; }
  if (prop === 'snap') { S.snap = v; return; }
  if (/^grade\d$/.test(prop)) { snapOnce('meta' + prop); S.meta.grades = (S.meta.grades || META_DEF().grades).slice(); S.meta.grades[+prop.slice(5)] = v; queueSave(); return; }
  const o = find(S.sel); if (!o || selIds().length !== 1) return;
  if (S.editing === o.id) S.editDirty = true; else snapOnce(o.id + prop);
  if (prop === 'kind' && o.type === 'shape') { o.kind = v; }
  else if (prop === 'choicesTxt') { o.choices = String(v).split('\n').map(s => s.trim()).filter(Boolean).slice(0, 40); }
  else if (prop === 'group') { o.group = String(v).trim().slice(0, 60); }
  else o[prop] = v;
  if (prop === 'ftype' && v === 'comb' && !o.comb) o.comb = 4;
  if (prop === 'ftype' && v === 'choice' && !(o.choices || []).length) o.choices = ['richtig', 'falsch'];
  if (prop === 'color' && o.type === 'highlight') { P.markColor = v; savePrefs(); }
  if (prop === 'gap') o.h = Math.max(v, Math.round(o.h / v) * v);
  if (o.type === 'coord') fixCoord(o);
  if (o.type === 'table') fixTable(o);
  if (prop === 'font' && (o.font === 'mono' || isCustom(o.font))) o.runs = normRuns(runsOf(o).map(r => Object.assign({}, r, { i: false })));
  renderObjs(o.page, S.editing === o.id); queueSave();
}
panel.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.cell) {
    const o = find(S.sel); if (!o || o.type !== 'table') return;
    snapOnce(o.id + 'cell' + t.dataset.cell + S.tableSol);
    const [r, c] = t.dataset.cell.split(',').map(Number);
    (S.tableSol ? o.sol : o.cells)[r][c] = t.value; fixTable(o); renderObjs(o.page); queueSave(); return;
  }
  if (t.dataset.fn) {
    const o = find(S.sel); if (!o || o.type !== 'coord') return;
    snapOnce(o.id + 'fn' + t.dataset.fn + t.dataset.fk);
    const f = o.funcs[+t.dataset.fn]; f[t.dataset.fk] = t.type === 'checkbox' ? t.checked : t.value;
    renderObjs(o.page); queueSave();
    if (t.dataset.fk === 'src') { const w = panel.querySelector(`[data-fnwarn="${t.dataset.fn}"]`); let msg = ''; try { if (f.src) compileExpr(f.src); } catch (err) { msg = err.message; } if (w) { w.textContent = msg; w.hidden = !msg; } }
    if (t.type === 'checkbox') panelSnapFor = null;

  }
  if (t.dataset.runcolor) { if (isHex(t.value)) applyRunStyle('c', t.value); return; }

  const prop = t.dataset.prop; if (!prop) return;

  if (t.dataset.kind === 'num') { v = parseNum(v); if (!isFinite(v) || v < +t.dataset.min || v > +t.dataset.max) return; }
  if (t.dataset.kind === 'bool') v = t.checked;

panel.addEventListener('change', e => {

    const x = clamp(e.clientX - drag.r.left, 0, drag.r.width), y = clamp(e.clientY - drag.r.top, 0, drag.r.height);
    rect = { x: Math.min(x, drag.x), y: Math.min(y, drag.y), w: Math.abs(x - drag.x), h: Math.abs(y - drag.y), cw: drag.r.width };
    Object.assign(selDiv.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
    okBtn.disabled = rect.w < 8 || rect.h < 8;
  });
  wrap.addEventListener('pointerup', () => { drag = null; });
  d.querySelector('#cr-src').addEventListener('change', e => {
    if (e.target.value === 'file') { d._close(); $('#filePdf').dataset.mode = 'crop'; $('#filePdf').click(); return; }
    src = sources[+e.target.value]; pno = 1; capIn.value = cropCaps[capKey(src)] || ''; loadLabels(); show();
  });
  d.addEventListener('click', async e => {
    const pg = e.target.closest('[data-pg]'); if (pg) { pno += +pg.dataset.pg; show(); return; }
    const r = e.target.closest('[data-r]'); if (!r && e.target !== d) return;
    if (!r || r.dataset.r !== '1' || !rect) { d._close(); return; }
    /* In 200 dpi neu rendern und zuschneiden. */
    const pp = await src.pdf.getPage(pno), vp0 = pp.getViewport({ scale: 1 });
    const k = Math.min(200 / 72, Math.sqrt(MAX_PX / (vp0.width * vp0.height)));
    const vp = pp.getViewport({ scale: k }), f = vp.width / rect.cw;
    const full = document.createElement('canvas'); full.width = Math.round(vp.width); full.height = Math.round(vp.height);
    const ctx = full.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, full.width, full.height);
    await pp.render({ canvasContext: ctx, viewport: vp }).promise;
    const out = document.createElement('canvas'); out.width = Math.max(1, Math.round(rect.w * f)); out.height = Math.max(1, Math.round(rect.h * f));
    out.getContext('2d').drawImage(full, rect.x * f, rect.y * f, out.width, out.height, 0, 0, out.width, out.height);
    const url = out.toDataURL('image/png');
    full.width = 0; full.height = 0; out.width = 0; out.height = 0;
    const capTxt = capIn.value.replace(/\s+/g, ' ').trim();
    cropCaps[capKey(src)] = capTxt; cropCaps.pno = pnoIn.checked;
    const pl = labels && labels[pno - 1] ? String(labels[pno - 1]).trim() : String(pno);
    const caption = capTxt ? capTxt + (pnoIn.checked ? ', S. ' + pl : '') : '';
    d._close();
    /* Gleiche Groesse wie im Original (pt) */
    const o = await insertImageUrl(url, 'image/png', S.cur, null, rect.w * (vp0.width / rect.cw));
    if (o && caption) { o.caption = caption.slice(0, 200); renderObjs(o.page); renderPanel(); queueSave(); }
    toast(caption ? 'Ausschnitt mit Quellenangabe eingefügt.' : 'Ausschnitt eingefügt. Eine Quellenangabe kannst du rechts ergänzen.');
  });
  loadLabels();
  show();
}

/* ---------- Über Blattwerk und Hilfe ---------- */
function aboutHTML() {
  const tools = TOOLS.map(t => `<li><b>${esc(t.label)}</b> (Taste ${t.key.toUpperCase()}): ${esc(t.hint)}</li>`).join('');
  return `<div class="home-in">
    <div class="home-top"><button class="btn" data-h="main">${hi('back')}Zurück</button><h1>Über Blattwerk</h1></div>
    <section class="home-card">
      <p><b>Blattwerk</b> ist ein Werkzeug für Lehrkräfte: Arbeitsblätter als PDF anpassen, neu gestalten und für Schülerinnen und Schüler ausfüllbar machen. Aus einem Blatt entstehen Schülerfassung, Fassung mit Hilfen und Lösungsblatt. Alles läuft auf diesem Gerät, ohne Konto und ohne Internet.</p>
      <p class="mini">Version ${APP_VERSION}</p>
    </section>
    <section class="home-card"><h2>Erklärungen</h2>
      <details open><summary>Erste Schritte</summary><ol>
        <li><b>Neues Blatt</b> anlegen oder ein <b>PDF öffnen</b>. Das Beispielblatt zeigt fast alle Möglichkeiten.</li>
        <li>Links ein Werkzeug wählen und auf die Seite tippen oder ziehen. Rechts stellst du das gewählte Element ein.</li>
        <li><b>PDF exportieren</b> oben rechts: Das PDF geht über das Teilen-Menü in „Dateien“, per Mail oder AirDrop. Im Browser landet es im Download-Ordner.</li>
      </ol><p>Alles wird automatisch unter „Meine Blätter“ gespeichert. Rückgängig und Wiederholen findest du oben.</p></details>
      <details><summary>Die Werkzeuge</summary><ul>${tools}</ul></details>
      <details><summary>Vorhandenes PDF bearbeiten</summary><p>Mit <b>Text ändern</b> tippst du eine Zeile im PDF an. Blattwerk deckt sie ab und setzt sie als bearbeitbaren Text ein, in ähnlicher Schrift und Farbe. Eingescannte Seiten enthalten keine Schrift, nur ein Bild – dafür gibt es die Texterkennung (siehe unten).</p>
        <p>Über die Leiste rechts fügst du <b>Seiten aus einem anderen PDF</b> ein, duplizierst oder drehst Seiten. Mit <b>Ausschnitt</b> schneidest du einen Bereich aus einem PDF aus, etwa eine Aufgabe aus dem Schulbuch, und setzt ihn als Bild ein. Trägst du dabei die <b>Quelle</b> ein, steht sie klein unter dem Bild, auf Wunsch mit Seitenzahl.</p></details>
      <details><summary>Texterkennung: Scans und Fotos</summary><p>Bei eingescannten Seiten und Fotos ist der Text nur ein Bild. Tippe in der Leiste rechts auf <b>Text erkennen</b> (bei Bildern: „Text im Bild erkennen“). Das dauert pro Seite ein paar Sekunden und geschieht vollständig auf diesem Gerät.</p>
        <p>Danach kannst du mit <b>Text ändern</b> jede erkannte Zeile antippen und umschreiben, mit <b>Entfernen</b> Zeilen löschen, und im exportierten PDF ist der Text <b>durchsuchbar, kopierbar und vorlesbar</b> (wichtig für Vorlese-Funktionen bei Leseschwierigkeiten). Die <b>lesefreundliche Kopie</b> macht aus dem Scan echten, größeren Text; Abbildungen bleiben als Bild erhalten.</p>
        <p>Gut erkannt wird gedruckter Text in Deutsch. Unsichere Wörter sind orange unterstrichen – bitte gegenlesen. Formeln (Brüche, Potenzen), Handschrift und Tabellen erkennt sie kaum.</p></details>
      <details><summary>Fotos von Arbeitsblättern</summary><p>Ein Blatt mit dem Handy fotografiert? Füge das Foto mit <b>Bild</b> ein und tippe auf <b>Foto aufbereiten</b>. Blattwerk findet die Blattecken selbst; du kannst sie nachziehen. Das Bild wird gerade gezogen, der Tisch abgeschnitten und je nach Wahl <b>aufgehellt</b> (ohne Schatten), in <b>Graustufen</b> oder <b>Schwarzweiß</b> umgewandelt. „Seite füllen“ setzt es formatfüllend aufs Blatt. Das Originalfoto bleibt erhalten, du kannst jederzeit neu ansetzen.</p></details>
      <details><summary>Ausfüllbare Felder und Lösungen</summary><p><b>Textfelder</b>, <b>Ankreuzkästchen</b> und leere Zellen einer <b>Tabelle</b> sind im exportierten PDF ausfüllbar – in Adobe Reader, der Dateien-App, in Browsern und auf dem iPad.</p>
        <p>Bei jedem Textfeld trägst du rechts eine <b>Lösung</b> ein (mehrere richtige Antworten mit | trennen). Bei Kästchen legst du fest, ob sie richtig sind. Bei Wertetabellen berechnet „y-Werte als Lösung“ die Lösungen aus dem Funktionsterm.</p></details>
      <details><summary>Auf Schülergeräten ausfüllen</summary><p>Zuverlässig klappt das in der <b>Dateien-App</b> (iPad, iPhone), in <b>Adobe Acrobat Reader</b>, in <b>Chrome, Edge und Firefox</b> sowie in <b>GoodNotes</b> und <b>Notability</b>. Manche einfachen Vorschau-Apps zeigen Felder nur an.</p>
        <p>Felder-Arten: <b>Freitext</b> (auf Wunsch mit automatisch kleinerer Schrift), <b>Auswahlliste</b> (z. B. richtig/falsch), <b>Ziffernkästchen</b> für Ergebnisse und <b>Einfachauswahl</b> (runde Optionsfelder, nur eine Antwort). Die Tab-Taste springt Zeile für Zeile durch die Felder. „Formular prüfen“ findet zu kleine, überlappende oder doppelt benannte Felder.</p>
        <p>Für Rechnungen mit dem Stift eignen sich Rechenkästchen oder ein Kästchen-Hintergrund: Schüler schreiben dort mit ihrer PDF-App von Hand.</p></details>
      <details><summary>Vorlagen und Verlagsmaterial</summary><p><b>Entfernen</b>: Text oder Bild im PDF antippen, oder einen Rahmen um Teile ziehen. Beim Export wird der Inhalt wirklich gelöscht – auch kopieren lässt er sich danach nicht mehr. Bei „nur für Schüler“ bleibt er im Lösungsblatt sichtbar: So wird aus einem PDF mit Lösungen ein Arbeitsblatt plus Lösungsblatt.</p>
        <p><b>Lücken als Felder erkennen</b> (rechts bei der Seite) setzt ausfüllbare Felder auf Unterstriche, Punkt- und Schreiblinien und leere Kästchen. Hat ein PDF schon Formularfelder, übernimmt Blattwerk sie beim Öffnen; dann kannst du Lösungen eintragen und auswerten.</p></details>
      <details><summary>Ebenen: ein Blatt, drei Fassungen</summary><p>Jedes Element liegt auf einer Ebene: <b>Grundblatt</b>, <b>Hilfe</b> oder <b>Lösung</b>. Oben neben dem Blattnamen siehst du, auf welcher Ebene neue Elemente landen; antippen wechselt sie.</p>
        <p>Beim Export wählst du: <b>Schülerfassung</b> (nur Grundblatt, ausfüllbar), <b>mit Hilfen</b> (für Schüler, die Unterstützung brauchen) und <b>Lösungsblatt</b> (alles, Lösungen rot eingetragen). Ein <b>QR-Code</b> mit den Lösungen der Seite erlaubt Selbstkontrolle mit jeder Kamera-App, ohne Internet.</p></details>
      <details><summary>Mathematik: Formeln, Graphen, Formen</summary><p><b>Formel</b>: Brüche, Wurzeln, Potenzen, Indizes, Strecken und Vektoren über die Knöpfe rechts. Buchstaben erscheinen kursiv wie im Schulbuch.</p>
        <p><b>Koordinaten</b>: Bereich, Einheit (z. B. 1 cm), Kästchen, Funktionsgraphen in Heftschreibweise (0,5x + 2, x², sqrt(x), |x|) mit eigener Farbe, gestrichelt oder nur im Lösungsblatt, dazu Punkte wie A(1|3).</p>
        <p><b>Formen</b>: Strecke, Pfeil, Rechteck, Ellipse, Kreis mit Mittelpunkt und Radius, Dreieck, Trapez, Parallelogramm, Raute, Drachen, Winkel mit Gradanzeige und Rechenkästchen. Ecken lassen sich ziehen, die Vierecke behalten dabei ihre Eigenschaften (das Trapez bleibt ein Trapez). Rechts siehst du Seitenlängen und Winkel. Elemente rasten an Raster und Nachbarn ein (Alt-Taste: frei).</p></details>
      <details><summary>Klassenarbeit und Erwartungshorizont</summary><p>Setze an jede Aufgabe ein <b>Punktekästchen</b> mit Punktzahl, Anforderungsbereich, Kompetenz und erwarteter Leistung. Rechts siehst du Summe, Verteilung der AFB und den Notenschlüssel. „Erwartungshorizont als Seite anfügen“ erzeugt eine Tabelle, die nur im Lösungsblatt erscheint.</p></details>
      <details><summary>Ausgefüllte PDFs auswerten</summary><p>Unter „Ausgefüllte PDFs auswerten“ wählst du die zurückgegebenen Schüler-PDFs aus. Blattwerk vergleicht die Eingaben mit den Lösungen und zeigt je Aufgabe den Anteil richtiger Antworten und häufige Fehler, je Schüler die Ergebnisse. „2,5“, „5/2“ und „2.5“ zählen gleich. Freie Antworten bitte selbst prüfen. Die Dateien werden nur gelesen und nicht gespeichert; eine Tabelle (CSV) sicherst du bei Bedarf.</p>
        <p><b>Korrigierte PDFs zurückgeben</b>: Blattwerk setzt in jedes Schüler-PDF grüne Häkchen und rote Kreuze, auf Wunsch die richtige Lösung, oben das Ergebnis und deinen Kommentar. Die Antworten lassen sich dabei einfrieren. Alle Dateien gehen gesammelt über das Teilen-Menü zurück, zum Drucken auch als eine Datei.</p></details>
      <details><summary>Lesefreundliche Kopie</summary><p>Erstellt eine zweite Fassung mit mindestens 13 pt Schrift und mehr Zeilenabstand. Inhalte rutschen nach unten und laufen bei Bedarf auf eine neue Seite. Das Original bleibt erhalten.</p></details>
      <details><summary>Speichern und Datenschutz</summary><p>Blätter, Bilder und eigene Schriften liegen nur auf diesem Gerät. Blattwerk überträgt keine Daten, hat keine Werbung und kein Tracking. Zur Sicherung oder für ein anderes Gerät exportierst du ein Blatt als Projektdatei (Strg+S oder „Projekt als Datei sichern“).</p></details>

homeEl.addEventListener('click', async e => {
  const a = e.target.closest('a[data-leave]');
  if (a) { e.preventDefault(); await flushSave(); location.href = a.getAttribute('href'); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pset) { setPref(b.dataset.pset, JSON.parse(b.dataset.v)); renderHome(); return; }
  const h = b.dataset.h; if (!h || homeBusy) return;
  switch (h) {
    case 'main': case 'settings': case 'about': homeView = h; renderHome(); break;
    case 'continue': hideHome(); break;
    case 'new': newDialog(); break;
    case 'open': $('#fileOpen').click(); break;
    case 'sample': newSheet(true); break;
    case 'lib': libraryDialog(); break;
    case 'recent': {
      homeBusy = true; const done = busy('Blatt wird geöffnet …');
      try { await openStored(b.dataset.id); } finally { done(); homeBusy = false; }
      break;
    }
    case 'reset':
      if (await ask('Alle Einstellungen auf die Vorgaben zurücksetzen? Deine Blätter bleiben erhalten.', 'Zurücksetzen')) {
        Object.assign(P, JSON.parse(JSON.stringify(PREF_DEF))); savePrefs(); applyTheme(); S.snap = P.snap; renderHome();
      }
      break;
  }
});
homeEl.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pbool) { setPref(t.dataset.pbool, t.checked); return; }
  if (t.dataset.pcolor && isHex(t.value)) { setPref(t.dataset.pcolor, t.value.toLowerCase()); renderHome(); return; }
  if (t.dataset.pgrade != null) {
    const v = parseFloat(String(t.value).replace(',', '.'));
    if (isFinite(v) && v >= 0 && v <= 100) { const g = P.grades.slice(); g[+t.dataset.pgrade] = v; setPref('grades', g); }
    t.value = String(P.grades[+t.dataset.pgrade]).replace('.', ',');
  }
});
$('#btnHome').onclick = () => showHome('main');

/* ======================================================================
   Echtes Entfernen beim Export
   Abgedeckte Inhalte sollen nicht nur verdeckt, sondern aus dem PDF
   gelöscht sein – sonst lassen sich verdeckte Lösungen herauskopieren.
   Der Seiteninhalt wird gelesen und neu geschrieben:
   - Schriftzeichen, deren Mitte unter einer Abdeckung liegt, fallen weg
     (ersetzt durch gleich breiten Leerraum, der Rest der Zeile bleibt stehen)
   - Bilder und Zeichnungen, die ganz unter einer Abdeckung liegen, fallen weg
   - Formular-XObjects werden als Kopie mitbearbeitet
   Was sich so nicht sicher entfernen lässt (Bild nur teilweise abgedeckt,
   unbekannte Kodierung), meldet `RedactUnsupported`; dann wird nur diese
   Seite als Bild ausgegeben.

  },
  /* ---------- Matrizen ---------- */
  mul: (a, b) => [a[0] * b[0] + a[1] * b[2], a[0] * b[1] + a[1] * b[3], a[2] * b[0] + a[3] * b[2], a[2] * b[1] + a[3] * b[3], a[4] * b[0] + a[5] * b[2] + b[4], a[4] * b[1] + a[5] * b[3] + b[5]],

/* Bearbeitet einen Inhaltsstrom. Gibt den neuen Text zurück oder null, wenn
   nichts entfernt wurde. */
function redactStream(src, ctx) {
  const { PDFName, PDFDict, PDFRawStream } = PL;
  const ops = RX.parse(src), rects = ctx.rects;
  const hit = p => rects.some(r => RX.inside(p, r));
  let gs = { ctm: ctx.ctm.slice(), tc: 0, tw: 0, th: 1, tl: 0, font: null, fs: 0, rise: 0 };
  const stack = [];
  let tm = [1, 0, 0, 1, 0, 0], tlm = tm.slice(), path = [], changed = false;
  const out = [];
  let last = 0;
  const replace = (op, text) => { out.push(src.slice(last, op.s), text); last = op.e; changed = true; };
  const fontRes = name => { const fd = ctx.res && ctx.res.lookup(PDFName.of('Font')); const f = fd && fd.lookup(PDFName.of(name)); if (!(f instanceof PDFDict)) throw new RedactUnsupported('Schrift fehlt: ' + name); return f; };
  const moveText = (tx, ty) => { tlm = RX.mul([1, 0, 0, 1, tx, ty], tlm); tm = tlm.slice(); };

  function show(items) {
    if (!gs.font) throw new RedactUnsupported('Text ohne Schrift');
    const fi = RX.fontInfo(gs.font, ctx.fontCache), fs = gs.fs, th = gs.th;
    const parts = []; let removedAny = false, run = '', gap = 0;
    const flushRun = () => { if (run) { parts.push(RX.hex(run)); run = ''; } };
    const flushGap = () => { if (gap) { parts.push(RX.fmt(-gap * 1000 / ((fs * th) || 1))); gap = 0; } };
    for (const it of items) {
      if (it.t === 'num') {
        flushRun(); flushGap();
        parts.push(RX.fmt(it.v));
        tm = RX.mul([1, 0, 0, 1, -it.v / 1000 * fs * th, 0], tm);
        continue;
      }
      if (it.t !== 'str') continue;
      const s = it.v;
      for (let k = 0; k + fi.bytes <= s.length; k += fi.bytes) {
        const code = fi.bytes === 2 ? s.charCodeAt(k) * 256 + s.charCodeAt(k + 1) : s.charCodeAt(k);
        const w0 = fi.width(code);
        const tx = (w0 * fs + gs.tc + (fi.bytes === 1 && code === 32 ? gs.tw : 0)) * th;
        const m = RX.mul(tm, gs.ctm);

      case 'q': stack.push(Object.assign({}, gs, { ctm: gs.ctm.slice() })); break;
      case 'Q': if (stack.length) gs = stack.pop(); break;
      case 'cm': gs.ctm = RX.mul([N(0), N(1), N(2), N(3), N(4), N(5)], gs.ctm); break;
      case 'BT': tm = [1, 0, 0, 1, 0, 0]; tlm = tm.slice(); break;
      case 'Tc': gs.tc = N(0); break;
      case 'Tw': gs.tw = N(0); break;
      case 'Tz': gs.th = N(0) / 100; break;
      case 'TL': gs.tl = N(0); break;
      case 'Ts': gs.rise = N(0); break;
      case 'Tf': gs.font = fontRes(a[0] && a[0].v); gs.fs = N(1); break;
      case 'Td': moveText(N(0), N(1)); break;
      case 'TD': gs.tl = -N(1); moveText(N(0), N(1)); break;
      case 'Tm': tm = [N(0), N(1), N(2), N(3), N(4), N(5)]; tlm = tm.slice(); break;
      case 'T*': moveText(0, -gs.tl); break;
      case 'Tj': { const r = show([a[0]]); if (r) replace(op, r); break; }
      case 'TJ': { const r = show(a[0] && a[0].t === 'arr' ? a[0].v : []); if (r) replace(op, r); break; }
      case "'": { moveText(0, -gs.tl); const r = show([a[0]]); if (r) replace(op, 'T* ' + r); break; }
      case '"': { gs.tw = N(0); gs.tc = N(1); moveText(0, -gs.tl); const r = show([a[2]]); if (r) replace(op, `${RX.fmt(N(0))} Tw ${RX.fmt(N(1))} Tc T* ${r}`); break; }

      case 're': { const x = N(0), y = N(1), w = N(2), h = N(3); path.push(...[[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(p => RX.apply(p, gs.ctm))); break; }

        if (path.length && rects.some(r => RX.within(RX.bboxOf(path), r))) replace(op, 'n');
        path = []; break;
      case 'n': path = []; break;
      case 'BI': {
        const b = RX.bboxOf([[0, 0], [1, 0], [0, 1], [1, 1]].map(p => RX.apply(p, gs.ctm)));
        if (rects.some(r => RX.within(b, r))) replace(op, '');
        else if (rects.some(r => RX.meets(b, r))) throw new RedactUnsupported('Bild teilweise abgedeckt');

      }

        const xo = xd && xd.lookup(PDFName.of(nm));

        const dict = xo.dict || xo, sub = String(dict.lookup(PDFName.of('Subtype')) || '').replace(/^\//, '');
        if (sub === 'Image') {
          const b = RX.bboxOf([[0, 0], [1, 0], [0, 1], [1, 1]].map(p => RX.apply(p, gs.ctm)));
          if (rects.some(r => RX.within(b, r))) { replace(op, ''); if (!ctx.depth && ctx.removed) ctx.removed.add(nm); }
          else if (rects.some(r => RX.meets(b, r))) throw new RedactUnsupported('Bild teilweise abgedeckt');
        } else if (sub === 'Form') {
          const mA = dict.lookup(PDFName.of('Matrix')), mat = mA ? [0, 1, 2, 3, 4, 5].map(k => mA.lookup(k).asNumber()) : [1, 0, 0, 1, 0, 0];
          const bbA = dict.lookup(PDFName.of('BBox')), bb = bbA ? [0, 1, 2, 3].map(k => bbA.lookup(k).asNumber()) : null;
          const fctm = RX.mul(mat, gs.ctm);
          if (bb) { const b = RX.bboxOf([[bb[0], bb[1]], [bb[2], bb[1]], [bb[0], bb[3]], [bb[2], bb[3]]].map(p => RX.apply(p, fctm))); if (!rects.some(r => RX.meets(b, r))) break; }
          if (ctx.depth > 4 || !(xo instanceof PDFRawStream)) throw new RedactUnsupported('Formular-XObject');
          const fres = dict.lookup(PDFName.of('Resources')) || ctx.res;
          const inner = redactStream(RX.toStr(PL.decodePDFRawStream(xo).decode()), Object.assign({}, ctx, { ctm: fctm, res: fres, depth: ctx.depth + 1 }));
          if (inner != null) {
            const nd = dict.clone(ctx.doc.context);
            nd.delete(PDFName.of('Filter')); nd.delete(PDFName.of('DecodeParms')); nd.delete(PDFName.of('Length'));
            const ns = ctx.doc.context.flateStream(RX.toBytes(inner), {});
            for (const [k, v] of nd.entries()) ns.dict.set(k, v);
            ns.dict.set(PDFName.of('Filter'), PDFName.of('FlateDecode'));
            const name = ctx.addXObject(ctx.doc.context.register(ns));
            replace(op, `/${name} Do`);
          }
        }
        break;
      }
    }
  }

/* Nicht mehr erreichbare Objekte aus der Datei werfen (entfernte Bilder und

  const { PDFRef, PDFDict, PDFArray, PDFStream } = PL;
  const ctx = doc.context, seen = new Set(), t = ctx.trailerInfo;

    let o = stack.pop();
    if (o instanceof PDFRef) { if (seen.has(o.tag)) continue; seen.add(o.tag); o = ctx.lookup(o); if (!o) continue; }
    if (o instanceof PDFDict) { for (const [, v] of o.entries()) stack.push(v); }
    else if (o instanceof PDFArray) { for (const v of o.asArray()) stack.push(v); }
    else if (o instanceof PDFStream) stack.push(o.dict);

  for (const [ref] of ctx.enumerateIndirectObjects()) if (!seen.has(ref.tag)) { ctx.delete(ref); n++; }

/* pdf-lib schreibt nach dem Löschen von Objekten Querverweise mit Lücken, die

/* Entfernt Inhalte einer (kopierten) Seite unter den Rechtecken. Gibt die Zahl
   der Änderungen zurück; RedactUnsupported, wenn das nicht sicher geht. */
function redactPage(doc, page, rects) {
  if (!rects.length) return false;
  const { PDFName, PDFArray, PDFDict, PDFRawStream } = PL;
  const node = page.node, ctxt = doc.context;
  const contents = node.Contents();
  const streams = contents instanceof PDFArray ? contents.asArray().map(r => ctxt.lookup(r)) : contents ? [contents] : [];
  if (!streams.every(s => s instanceof PDFRawStream)) throw new RedactUnsupported('Inhalt nicht lesbar');
  const src = streams.map(s => RX.toStr(PL.decodePDFRawStream(s).decode())).join('\n');
  /* Ressourcen für diese Seite kopieren, bevor etwas ergänzt wird */
  let res = node.Resources();
  let resCloned = false, xCloned = false, nameN = 0;
  const addXObject = ref => {
    if (!resCloned) { res = res.clone(ctxt); node.set(PDFName.of('Resources'), res); resCloned = true; }
    let xd = res.lookup(PDFName.of('XObject'));
    if (!xCloned) { xd = xd ? xd.clone(ctxt) : ctxt.obj({}); res.set(PDFName.of('XObject'), xd); xCloned = true; }
    let name; do { name = 'BwR' + (++nameN); } while (xd.has(PDFName.of(name)));
    xd.set(PDFName.of(name), ref);
    return name;
  };
  const removed = new Set();
  const out = redactStream(src, { rects, ctm: [1, 0, 0, 1, 0, 0], res, doc, fontCache: new Map(), depth: 0, addXObject, removed });
  /* Entfernte Bilder auch aus den Ressourcen dieser Seite nehmen, damit die
     Bilddaten nicht mehr in der Datei stehen (sofern sonst nicht benutzt). */
  for (const nm of removed) {
    if (out != null && new RegExp('/' + nm.replace(/[^\w]/g, '\\$&') + '[\\s]+Do').test(out)) continue;
    if (!resCloned) { res = res.clone(ctxt); node.set(PDFName.of('Resources'), res); resCloned = true; }
    let xd = res.lookup(PDFName.of('XObject'));
    if (!xCloned) { xd = xd.clone(ctxt); res.set(PDFName.of('XObject'), xd); xCloned = true; }
    xd.delete(PDFName.of(nm));
  }
  /* Notizen und Kommentare, die ganz unter einer Abdeckung liegen */
  const annots = node.Annots();
  if (annots instanceof PDFArray) {
    const keep = annots.asArray().filter(r => {
      const an = ctxt.lookup(r); if (!(an instanceof PDFDict)) return true;
      const R = an.lookup(PDFName.of('Rect')); if (!(R instanceof PDFArray)) return true;
      const [x0, y0, x1, y1] = [0, 1, 2, 3].map(k => R.lookup(k).asNumber());
      return !rects.some(r => RX.within([Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)], r));
    });
    if (keep.length !== annots.size()) node.set(PDFName.of('Annots'), ctxt.obj(keep));
  }
  if (out == null) return removed.size > 0;
  const ns = ctxt.flateStream(RX.toBytes(out), {});
  node.set(PDFName.of('Contents'), ctxt.register(ns));
  return true;
}

/* ======================================================================
   Fotos und Scans aufbereiten: entzerren, zuschneiden, drehen, aufhellen
   Alles rechnet im Gerät, ohne Netz.
   ====================================================================== */
const SCAN_MODES = [['orig', 'Original'], ['color', 'Aufgehellt'], ['gray', 'Graustufen'], ['bw', 'Schwarzweiß']];
const FULL_QUAD = () => [[0, 0], [1, 0], [1, 1], [0, 1]];

/* Papierblatt im Foto finden: helle, zusammenhängende Fläche, deren Ecken
   die Extrempunkte von x+y und x−y sind. null, wenn nichts Klares da ist. */
function scanFindQuad(im) {
  const W0 = im.naturalWidth || im.width, H0 = im.naturalHeight || im.height;
  const k = 320 / Math.max(W0, H0), w = Math.max(8, Math.round(W0 * k)), h = Math.max(8, Math.round(H0 * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data; c.width = 0; c.height = 0;
  const N = w * h, L = new Uint8Array(N), hist = new Float64Array(256);

  /* Otsu-Schwelle */
  let sum = 0; for (let v = 0; v < 256; v++) sum += v * hist[v];
  let sB = 0, wB = 0, best = -1, t = 128;
  for (let v = 0; v < 256; v++) {
    wB += hist[v]; if (!wB) continue; const wF = N - wB; if (!wF) break;
    sB += v * hist[v]; const mB = sB / wB, mF = (sum - sB) / wF, b = wB * wF * (mB - mF) * (mB - mF);
    if (b > best) { best = b; t = v; }

  let bestId = 0, bestN = 0, id = 0;
  for (let s = 0; s < N; s++) {
    if (lab[s] || L[s] <= t) continue;
    id++; let qh = 0, qt = 0, n = 0; q[qt++] = s; lab[s] = id;
    while (qh < qt) {
      const p = q[qh++]; n++; const x = p % w;
      if (x > 0 && !lab[p - 1] && L[p - 1] > t) { lab[p - 1] = id; q[qt++] = p - 1; }
      if (x < w - 1 && !lab[p + 1] && L[p + 1] > t) { lab[p + 1] = id; q[qt++] = p + 1; }
      if (p >= w && !lab[p - w] && L[p - w] > t) { lab[p - w] = id; q[qt++] = p - w; }
      if (p < N - w && !lab[p + w] && L[p + w] > t) { lab[p + w] = id; q[qt++] = p + w; }
    }

  if (bestN < N * 0.15 || bestN > N * 0.97) return null;

    if (x + y < a[0]) a = [x + y, x, y];
    if (x + y > cc[0]) cc = [x + y, x, y];
    if (x - y > b[0]) b = [x - y, x, y];
    if (x - y < e[0]) e = [x - y, x, y];

  const Q = [a, b, cc, e].map(([, x, y]) => [clamp(x / w, 0, 1), clamp(y / h, 0, 1)]);
  /* Zu kleine oder verdrehte Vierecke verwerfen */
  const area = Math.abs(Q.reduce((s, p, i) => { const r = Q[(i + 1) % 4]; return s + p[0] * r[1] - r[0] * p[1]; }, 0)) / 2;
  if (area < 0.12) return null;
  /* Ein Blatt füllt sein Viereck fast ganz aus; zerklüftete helle Flächen sind keins. */
  const fill = bestN / (area * N);
  if (fill < 0.88 || fill > 1.08) return null;
  const cr = (o, p, r) => (p[0] - o[0]) * (r[1] - o[1]) - (p[1] - o[1]) * (r[0] - o[0]);
  const sg = Q.map((p, i) => Math.sign(cr(p, Q[(i + 1) % 4], Q[(i + 2) % 4])));

  if (Q.every((p, i) => Math.hypot(p[0] - FULL_QUAD()[i][0], p[1] - FULL_QUAD()[i][1]) < 0.03)) return null;
  return Q;
}

/* Homographie: bildet die vier Punkte src auf dst ab. */
function homography(src, dst) {
  const A = [], B = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v);
  }
  for (let c = 0; c < 8; c++) {
    let piv = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-12) return null;
    [A[c], A[piv]] = [A[piv], A[c]]; [B[c], B[piv]] = [B[piv], B[c]];
    for (let r = 0; r < 8; r++) {
      if (r === c) continue; const f = A[r][c] / A[c][c]; if (!f) continue;
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; B[r] -= f * B[c];
    }
  }
  const h = B.map((v, i) => v / A[i][i]);
  return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];

/* Ausgabegröße aus den Kantenlängen; nahe an DIN-A-Format wird es genau √2. */
function scanSize(quad, W0, H0, maxSide) {
  const P = quad.map(([x, y]) => [x * W0, y * H0]), len = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

     deshalb wird ein Verhältnis nahe DIN A (√2) auf genau √2 gesetzt. */
  let w = (len(P[0], P[1]) + len(P[3], P[2])) / 2, h = (len(P[0], P[3]) + len(P[1], P[2])) / 2;
  const r = h / w, R = Math.SQRT2;
  if (Math.abs(r / R - 1) < 0.15) { const a = Math.sqrt(w * h / R); w = a; h = a * R; }
  else if (Math.abs(r * R - 1) < 0.15) { const a = Math.sqrt(w * h / R); h = a; w = a * R; }
  const k = Math.min(1, maxSide / Math.max(w, h));
  return [Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k))];

/* Entzerren mit bilinearer Abtastung. src: ImageData des Originals. */
function scanWarp(src, quad, W, H) {
  const sw = src.width, sh = src.height, sd = src.data;

    const yy = y + 0.5;
    for (let x = 0; x < W; x++) {

      const x0 = u | 0, y0 = v | 0, x1 = x0 < sw - 1 ? x0 + 1 : x0, y1 = y0 < sh - 1 ? y0 + 1 : y0;

/* Aufhellen: Papierfarbe je Bereich schätzen (Blockmaximum, geglättet) und
   durch sie teilen. Das nimmt Schatten und Gelbstich weg. */
function scanFilter(img, mode) {

    const hs = [new Uint32Array(64), new Uint32Array(64), new Uint32Array(64)]; let n = 0;
    for (let y = by * B; y < Math.min(H, by * B + B); y += 2) for (let x = bx * B; x < Math.min(W, bx * B + B); x += 2) { const i = (y * W + x) * 4; hs[0][d[i] >> 2]++; hs[1][d[i + 1] >> 2]++; hs[2][d[i + 2] >> 2]++; n++; }

      for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
        let s = 0, n = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const yy = y + dy, xx = x + dx; if (yy >= 0 && yy < bh && xx >= 0 && xx < bw) { s += a[yy * bw + xx]; n++; } }

/* Ganzes Verfahren: Quelle → entzerrt, gefiltert, gedreht → Canvas */
function scanRender(im, st, maxSide) {

  const sc = document.createElement('canvas'); sc.width = Math.max(1, Math.round(W0 * ks)); sc.height = Math.max(1, Math.round(H0 * ks));

  const src = sctx.getImageData(0, 0, sc.width, sc.height); sc.width = 0; sc.height = 0;
  const [W, H] = scanSize(st.q, src.width, src.height, maxSide);

/* Neues Seitenverhältnis: Breite halten, notfalls verkleinern, auf der Seite lassen */

  if (w > p.w - 20) { w = p.w - 20; h = w / ar; }

/* Bild auf die ganze Seite (mit Rand) setzen */

/* ======================================================================
   Lesefreundliche Kopie: größere Schrift, mehr Zeilenabstand,
   Inhalte rutschen nach unten, bei Bedarf auf neue Seiten.
   Gilt für selbst angelegte Seiten; PDF-Seiten bleiben unverändert.
   ====================================================================== */
function readableTransform(pages, objs) {
  const outPages = [];
  let removed = 0, pdfPages = 0;
  const grow = o => {
    switch (o.type) {
      case 'text': if (!isCustom(o.font)) o.font = 'sans'; o.size = r1(Math.max(o.size * 1.2, 13)); o.lh = Math.max(o.lh || 1.2, 1.5); break;
      case 'field': o.size = Math.max(o.size, 13); o.h = r1(o.multi ? o.h * 1.2 : Math.max(o.h, 22)); break;
      case 'check': o.fs = Math.max(o.fs, 13); o.h = Math.max(o.h, 14); break;
      case 'table': o.size = Math.max(o.size, 13); o.rh = Math.max(o.rh || 20, 26); fixTable(o); break;
      case 'formula': o.size = r1(Math.max(o.size * 1.2, 17)); break;
      case 'lines': { const n = Math.max(1, Math.floor(o.h / o.gap + 1e-6)); o.gap = Math.max(o.gap, 30); o.h = n * o.gap; break; }
    }
    computeBox(o);
  };
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  for (const p of pages) {
    outPages.push(p);
    if (p.sid != null) { pdfPages++; continue; }
    let mine = objs.filter(o => o.page === p.id);
    /* Markierungen über Text passen nach dem Umbruch nicht mehr. */
    const texts = mine.filter(o => o.type === 'text');
    const drop = new Set(mine.filter(o => o.type === 'highlight' && texts.some(t => overlaps(o, t))));
    removed += drop.size;
    for (let i = objs.length - 1; i >= 0; i--) if (drop.has(objs[i])) objs.splice(i, 1);
    mine = mine.filter(o => !drop.has(o));
    const before = new Map(mine.map(o => [o, { y: o.y, b: o.y + o.h, w: o.w }]));
    const lines0 = new Map(mine.filter(o => o.type === 'text').map(o => [o, layoutText(o).lines.length]));
    mine.forEach(grow);
    /* Kurze Beschriftungen ("Name:") nicht umbrechen: verbreitern und die
       Nachbarn derselben Zeile nach rechts schieben, notfalls schmaler machen. */
    const right = p.w - 10 * MM;
    for (const o of mine) {
      if (o.type !== 'text' || lines0.get(o) !== 1 || before.get(o).w > 150 || layoutText(o).lines.length === 1) continue;
      const nat = layoutText(Object.assign({}, o, { w: 1e5 })).lines[0].w + 2;
      const dw = Math.min(nat, right - o.x) - o.w;
      if (dw <= 0) continue;
      const b0 = before.get(o), x0 = o.x + o.w;
      o.w = r1(o.w + dw); computeBox(o);
      for (const n of mine) {
        if (n === o || n.x < x0 - 1) continue;
        const bn = before.get(n);
        if (bn.y >= b0.b || bn.b <= b0.y) continue;
        moveObj(n, dw, 0);
        if (n.x + n.w > right) { if (['field', 'lines', 'text', 'table'].includes(n.type)) { n.w = r1(Math.max(20, right - n.x)); if (n.type === 'table') fixTable(n); computeBox(n); } else moveObj(n, Math.max(0, right - n.w) - n.x, 0); }
      }
    }
    const sorted = mine.slice().sort((a, b) => before.get(a).y - before.get(b).y || a.x - b.x);
    const shift = new Map();
    for (const o of sorted) {
      const b0 = before.get(o); let s = 0;
      for (const a of sorted) {
        if (a === o) break;
        const ba = before.get(a);
        if (ba.b <= b0.y + 1) s = Math.max(s, shift.get(a) + (a.h - (ba.b - ba.y)));
      }
      shift.set(o, Math.max(0, s));
    }
    sorted.forEach(o => moveObj(o, 0, shift.get(o)));
    /* Überlauf auf neue Seiten */
    const top = Math.max(((p.bg && p.bg.top) || 10), 15) * MM;
    let cur = p, list = sorted, guard = 0;
    while (guard++ < 50) {
      const limit = cur.h - 10 * MM;
      const over = list.filter(o => o.y + o.h > limit + 0.5 && o.y > top + 0.5);
      if (!over.length) break;
      const y0 = Math.min(...over.map(o => o.y));
      const move = list.filter(o => o.y >= y0 - 0.5);
      const np = JSON.parse(JSON.stringify(cur)); np.id = nid('p'); delete np.horizon;
      if (np.bg) np.bg.top = Math.max(np.bg.margin || 10, 10);
      outPages.push(np);
      move.forEach(o => { moveObj(o, 0, top - y0); o.page = np.id; });
      cur = np; list = move;
    }
  }
  return { pages: outPages, objs, removed, pdfPages };
}
async function readableCopy() {
  endEdit(); await flushSave();
  const oldId = S.docId, oldName = docName();
  const pages = JSON.parse(JSON.stringify(S.pages)), objs = JSON.parse(JSON.stringify(S.objs));
  const idMap = {};
  pages.forEach(p => { const n = nid('p'); idMap[p.id] = n; p.id = n; });
  objs.forEach(o => { o.id = nid('o'); o.page = idMap[o.page]; });
  /* Scans und Fotos mit erkanntem Text werden zu echtem Text (vorher!) */
  const imgs = Object.assign({}, S.imgs);
  let fromScan = 0;
  if (pages.some(p => p.ocr) || objs.some(o => o.ocr)) {
    const done = busy('Erkannter Text wird übernommen …');
    try { fromScan = await ocrReadable(pages, objs, imgs); } catch (e) { console.error(e); } finally { done(); }
  }
  const r = readableTransform(pages, objs);
  const id = nid('d'), srcs = Object.assign({}, S.srcs);
  $('#docName').value = (oldName + ' (lesefreundlich)').slice(0, 120);
  resetDoc({ docId: id, srcs, pages: r.pages, objs: r.objs, imgs, meta: JSON.parse(JSON.stringify(S.meta)) });
  for (const [sid, s] of Object.entries(srcs)) { try { await DB.putPdf(id + '/' + sid, s.bytes); } catch (e) { console.error(e); } }
  await flushSave();
  const notes = ['Lesefreundliche Kopie angelegt: größere Schrift, mehr Zeilenabstand.'];
  if (r.removed) notes.push(`${r.removed} Markierung${r.removed === 1 ? '' : 'en'} über Text entfernt – bitte neu setzen.`);
  if (fromScan) notes.push('Text aus Scans und Fotos wurde übernommen – bitte gegenlesen.');
  if (r.pdfPages) notes.push(fromScan ? 'Seiten ohne erkannten Text bleiben unverändert.' : 'PDF-Seiten bleiben unverändert.');
  toast(notes.join(' '), [['Original öffnen', () => openStored(oldId)]], 12000);
}

    <label class="tg"><input type="checkbox" id="nhBig">Großes Schreibfeld über die ganze Seite (zum Tippen am Tablet)</label>
    <p class="dnote">Exportiert wird ein ausfüllbares PDF. Abstände, Rand und Linienfarbe stellst du danach rechts ein. Dein aktuelles Blatt bleibt unter „Meine Blätter“ gespeichert.</p>
    <div class="row end"><button class="btn" data-r="0">Abbrechen</button><button class="btn primary" data-r="1">Blatt anlegen</button></div>`, 'wide');
  const close = ok => { const head = d.querySelector('#nhHead').checked, big = d.querySelector('#nhBig').checked; d.remove(); if (ok) { P.bg = sel; P.head = head; savePrefs(); newSheet(false, { bg: sel, land, head, big }); setTool('select'); } };
  d._close = () => close(false);
  d.addEventListener('click', e => {
    const t = e.target.closest('[data-bg]'); if (t) { sel = t.dataset.bg; d.querySelectorAll('[data-bg]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
    const l = e.target.closest('[data-land]'); if (l) { land = l.dataset.land === '1'; d.querySelectorAll('[data-land]').forEach(b => b.setAttribute('aria-pressed', String(b === l))); return; }
    const r = e.target.closest('[data-r]'); if (r) close(r.dataset.r === '1'); else if (e.target === d) close(false);
  });
  d.querySelector('[data-r="1"]').focus();
}

$('#btnNew').onclick = newDialog;

};

  let bytes; try { bytes = new Uint8Array(await f.arrayBuffer()); } catch (err) { toast('Die Datei ließ sich nicht lesen.'); return; }

stage.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(S.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX, e.clientY); } }, { passive: false });
let scrollQ = 0;
stage.addEventListener('scroll', () => {
  paintVisible();
  cancelAnimationFrame(scrollQ);
  scrollQ = requestAnimationFrame(() => {
    const sr = stage.getBoundingClientRect(), mid = sr.top + sr.height / 2; let best = null, bd = 1e9;
    pagesEl.querySelectorAll('.page').forEach(pg => { const r = pg.getBoundingClientRect(); const d = mid < r.top ? r.top - mid : mid > r.bottom ? mid - r.bottom : 0; if (d < bd) { bd = d; best = pg.dataset.id; } });
    if (best) setCur(best);
  });
}, { passive: true });
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.fit) applyZoom(); else paintVisible(); }, 150); });
document.addEventListener('paste', e => {
  if (homeVisible()) return;
  if (e.target.closest && e.target.closest('input,textarea,[contenteditable="true"],[contenteditable="plaintext-only"]')) return;
  const f = [...((e.clipboardData || {}).files || [])].find(f => /^image\//.test(f.type));
  if (f) { e.preventDefault(); insertImage(f); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return;
  if (/^image\//.test(f.type)) { const pg = e.target.closest && e.target.closest('.page'); insertImage(f, pg ? pg.dataset.id : null, pg ? toPt(e, pg) : null); }
  else openFile(f);
});
/* Android: Die Zurücktaste schließt zuerst Dialoge, beendet die Bearbeitung
   und hebt eine Auswahl auf, bevor sie die App verlässt. */
document.addEventListener('backbutton', () => {
  const d = topDialog();
  if (d) { d._close ? d._close() : d.remove(); return; }
  if (homeVisible()) {
    if (homeView !== 'main') { homeView = 'main'; renderHome(); return; }
    flushSave().then(() => { if (navigator.app && navigator.app.exitApp) navigator.app.exitApp(); });
    return;
  }
  if (S.editing) { endEdit(); return; }
  if (selIds().length) { S.multiMode = false; select(null); return; }
  if (S.tool !== 'select') { setTool('select'); return; }
  showHome('main');
}, false);
/* iOS beendet Apps im Hintergrund ohne Vorwarnung: beim Wechsel sofort sichern. */
document.addEventListener('pause', () => { endEdit(); flushSave(); }, false);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', () => flushSave());

/* Service Worker nur im Browser (PWA). In der App liegen die Dateien ohnehin
   auf dem Gerät, und WKWebView unterstützt ihn unter app:// nicht. */
if (!IS_APP && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function loadFonts() {
  const want = ['400 20px "BW Sans"', '700 20px "BW Sans"', 'italic 400 20px "BW Sans"', 'italic 700 20px "BW Sans"',
    '400 20px "BW Serif"', '700 20px "BW Serif"', 'italic 400 20px "BW Serif"', 'italic 700 20px "BW Serif"', '400 20px "BW Mono"', '700 20px "BW Mono"', '400 20px "BW Math"'];
  const css = document.fonts && document.fonts.load ? Promise.all(want.map(f => document.fonts.load(f, 'Hg≤').catch(() => {}))) : Promise.resolve();
  await Promise.race([Promise.all([css, loadFontkitFonts()]), new Promise(r => setTimeout(r, 8000))]);
  widthCache.clear();
}
applyTheme();
async function boot() {
  S.booting = true;
  buildTools();
  setTool('select');
  await loadFonts();
  if (!pdfjs || !PL) toast('Die PDF-Bibliotheken fehlen. Bitte die App neu installieren.', null, 10000);
  if (!window.fontkit || !FKS['NotoSans-Regular']) toast('Die eingebauten Schriften ließen sich nicht laden. Der PDF-Export nutzt Ersatzschriften.', null, 8000);
  await loadStoredFonts();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  let opened = false;
  try {
    const metas = (await DB.listMeta()).sort((a, b) => b.updated - a.updated);
    if (metas.length) opened = await openStored(metas[0].id, true);
  } catch (e) { console.warn('Gerätespeicher nicht verfügbar', e); }
  if (!opened) newSheet(true);
  S.booting = false;
  if (P.start === 'home' || !opened) await showHome('main');
  document.documentElement.dataset.ready = '1';
}
if (IS_APP) document.addEventListener('deviceready', boot, { once: true }); else boot();
